<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.lz{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--new);margin:8px 0 4px}
.bar i{display:block}.g{background:var(--ok)}.o{background:var(--mid)}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1}
.top{display:flex;align-items:center;gap:10px}.top button{padding:8px 12px}.top h2{flex:1}
.bank{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:8px 0;max-height:30vh;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{border-radius:12px;padding:2px 9px;font-size:14px;border:1px solid var(--bd)}
.chip.d{background:var(--ok);border-color:var(--ok);color:#fff;text-decoration:line-through}
.it{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.it.s1{border-color:var(--ok)}.it.s2{border-color:var(--bad)}.it.s3{border-color:var(--mid)}
.nr{color:var(--mu);min-width:22px;font-weight:600}.bd{flex:1;min-width:0}
.gap{display:inline-block;min-width:54px;border-bottom:2px solid var(--mu)}
.r{display:flex;align-items:center;gap:8px;margin-top:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px;border-radius:9px;border:2px solid var(--bd);background:var(--bg);color:var(--fg)}
input:focus{outline:none;border-color:var(--ac)}
.s1 input{border-color:var(--ok);font-weight:600}.s2 input{border-color:var(--bad)}.s3 input{border-color:var(--mid)}
.ic{font-size:20px;min-width:24px;text-align:center}
.msg{font-size:14px;margin-top:6px}.msg button{padding:4px 10px;font-size:14px;margin-left:6px}
</style></head><body><main id="app"></main>

let P={};try{P=JSON.parse(localStorage.getItem('fw2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('fw2',JSON.stringify(P))}catch(e){}};
const A=document.getElementById('app'),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S=(c,j)=>(P[c+'-'+j]||{}).s||0,V=(c,j)=>(P[c+'-'+j]||{}).v||'';
const cnt=c=>{const r=[0,0,0];DATA[c].i.forEach((_,j)=>{const s=S(c,j);r[s==1?0:s?1:2]++});return r}; // richtig, versucht, offen
const bar=n=>{const t=n[0]+n[1]+n[2];return `<div class="bar"><i class="g" style="width:${n[0]/t*100}%"></i><i class="o" style="width:${n[1]/t*100}%"></i></div>`};
function home(){
 const tot=[0,0,0];DATA.forEach((_,c)=>cnt(c).forEach((n,k)=>tot[k]+=n));const all=tot[0]+tot[1]+tot[2];
 A.innerHTML=`<h1>Fremdwörter – Übungen</h1><p class="mu">Eine Übung pro Lernziel. Der Fortschritt wird auf diesem Gerät gespeichert.</p>
 <div class="card"><b>Gesamt: ${tot[0]} von ${all} richtig</b>${bar(tot)}<span class="mu">${tot[0]} richtig · ${tot[1]} noch offen/falsch · ${tot[2]} nicht bearbeitet</span></div>`+
 DATA.map((d,c)=>{const n=cnt(c);return `<button class="card lz" onclick="chap(${c})"><h2>${esc(d.n)}</h2>${bar(n)}<span class="mu">${n[0]} von ${d.i.length} richtig${n[0]==d.i.length?' ✔ geschafft':''}</span></button>`}).join('')+
 `<div class="row"><button onclick="if(confirm('Gesamten Fortschritt löschen?')){P={};save();home()}">Alles zurücksetzen</button></div>`;
 scrollTo(0,0);
}
function marked(c){const m=new Set();DATA[c].i.forEach((x,j)=>{if(S(c,j)==1){const v=V(c,j);(v===x.a?(x.b||x.a):v).split(',').forEach(w=>m.add(w.trim()))}});return m}
function chap(c){
 const d=DATA[c];
 A.innerHTML=`<div class="top"><button onclick="home()">←</button><h2>${esc(d.n)}</h2></div>
 <p class="mu" style="margin:6px 0">${esc(d.ins)}</p><div id="bank"></div><div id="list"></div>
 <div class="row"><button class="p" onclick="all(${c})">Alle prüfen</button><button onclick="if(confirm('Dieses Lernziel zurücksetzen?')){for(const k in P)if(k.startsWith('${c}-'))delete P[k];save();chap(${c})}">Zurücksetzen</button></div>`;
 document.getElementById('list').innerHTML=d.i.map((x,j)=>`<div class="it" id="it${j}"><div class="nr">${j+1}</div><div class="bd"><div>${esc(x.p).replace(/_____/g,'<span class="gap"></span>')}</div>
 <div class="r"><input id="in${j}" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Fremdwort schreiben" onkeydown="if(event.key==='Enter'){event.preventDefault();chk(${c},${j},true)}" onblur="chk(${c},${j})"><span class="ic" id="ic${j}"></span></div><div class="msg" id="ms${j}"></div></div></div>`).join('');
 d.i.forEach((_,j)=>show(c,j));bankr(c);
}
function bankr(c){const d=DATA[c],b=document.getElementById('bank');if(!d.bank.length){b.innerHTML='';return}
 const m=marked(c),n=cnt(c);
 b.innerHTML=`<div class="bank"><b>Auswahl</b> <span class="mu">· ${n[0]} von ${d.i.length} richtig</span><div class="chips">`+d.bank.map(w=>`<span class="chip${m.has(w)?' d':''}">${esc(w)}</span>`).join('')+`</div></div>`}
function show(c,j){
 const s=S(c,j),x=DATA[c].i[j],it=document.getElementById('it'+j),i=document.getElementById('in'+j),ms=document.getElementById('ms'+j);
 it.className='it'+(s?' s'+s:'');i.value=s==3?x.a:V(c,j);i.readOnly=s==1||s==3;
 document.getElementById('ic'+j).textContent=['','✔','✘','💡'][s];
 ms.innerHTML=s==2?`Noch nicht richtig. <button onclick="rev(${c},${j})">Lösung zeigen</button>`:s==3?'Lösung angezeigt – zählt nicht als richtig.':'';
}
function chk(c,j,go){
 const s=S(c,j),i=document.getElementById('in'+j);
 if(s==1||s==3){if(go)nxt(j);return}
 const v=i.value.trim().replace(/\s+/g,' ');if(!v){if(go)nxt(j);return}
 if(s==2&&V(c,j)===v){if(go)nxt(j);return}
 const x=DATA[c].i[j],hit=[x.a,...x.al].find(w=>w.toLowerCase()===v.toLowerCase());
 P[c+'-'+j]=hit?{s:1,v:hit}:{s:2,v};save();show(c,j);bankr(c);if(go)nxt(j);
}
function nxt(j){const n=document.getElementById('in'+(j+1));if(n)n.focus()}
function rev(c,j){P[c+'-'+j]={s:3,v:''};save();show(c,j)}
function all(c){DATA[c].i.forEach((_,j)=>chk(c,j));const n=cnt(c);if(n[0]==DATA[c].i.length)alert('Geschafft! Alle richtig 🎉')}
home();
</script></body></html>
