<title>Fremdwörter üben</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--card:#fff;--ac:#e8832a;--mu:#6b6b66;--bd:#ddd9d0;--ok:#2e9e5b;--mid:#e8a92a;--new:#c9c6bd;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--fg:#f0eee8;--card:#2a2a27;--mu:#a5a39b;--bd:#444;--new:#55544f}}
:root[data-theme="dark"]{--bg:#1c1c1a;--fg:#f0eee8;--card:#2a2a27;--mu:#a5a39b;--bd:#444;--new:#55544f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:18px;margin:0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.lz{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--new);margin:8px 0 4px}
.bar i{display:block}.g{background:var(--ok)}.o{background:var(--mid)}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.row{display:flex;gap:8px;margin:10px 0}.row button{flex:1}
input{width:100%;box-sizing:border-box;font:inherit;font-size:19px;padding:13px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg)}
input:focus{outline:none;border-color:var(--ac)}
.q{font-size:21px;margin:8px 0 14px}
.fb{border-radius:10px;padding:12px;margin:10px 0}.fb.y{background:rgba(46,158,91,.18)}.fb.n{background:rgba(214,69,69,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border-radius:14px;padding:4px 10px;font-size:14px;border:1px solid var(--bd);background:var(--card)}
.chip.s2{background:var(--ok);color:#fff;border-color:var(--ok)}.chip.s1{background:var(--mid);color:#222;border-color:var(--mid)}.chip.s0{color:var(--mu)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}.top button{padding:8px 12px}
.big{font-size:44px;text-align:center;margin:20px 0 4px}
</style></head><body><main id="app"></main>

den","okay","O.K."],["Wurfscheibe","Frisbee"]]}];
let P={};try{P=JSON.parse(localStorage.getItem('fwp')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('fwp',JSON.stringify(P))}catch(e){}};
const $=document.getElementById('app'),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const key=(c,j)=>c+'-'+j,st=(c,j)=>{const v=P[key(c,j)];return v===undefined?0:v>=2?2:1};
const cnt=c=>{const r=[0,0,0];DATA[c].i.forEach((_,j)=>r[st(c,j)]++);return r};
const norm=s=>s.trim().replace(/\s+/g,' ');
function home(){
 let tot=[0,0,0];DATA.forEach((_,c)=>cnt(c).forEach((n,k)=>tot[k]+=n));const all=tot[0]+tot[1]+tot[2];
 $.innerHTML=`<h1>Fremdwörter üben</h1><p class="mu">Gekonnt = 2× richtig in Folge. Fortschritt wird auf diesem Gerät gespeichert.</p>
 <div class="card"><b>Gesamt: ${tot[2]} von ${all} gekonnt</b>${bar(tot)}<span class="mu">${tot[2]} gekonnt · ${tot[1]} in Übung · ${tot[0]} neu</span></div>`+
 DATA.map((d,c)=>{const n=cnt(c);return `<button class="card lz" onclick="chap(${c})"><h2>${esc(d.n)}</h2>${bar(n)}<span class="mu">${n[2]} gekonnt · ${n[1]} in Übung · ${n[0]} neu</span></button>`}).join('')+
 `<p class="row"><button onclick="if(confirm('Gesamten Fortschritt löschen?')){P={};save();home()}">Alles zurücksetzen</button></p>`;
}
function bar(n){const t=n[0]+n[1]+n[2];return `<div class="bar"><i class="g" style="width:${n[2]/t*100}%"></i><i class="o" style="width:${n[1]/t*100}%"></i></div>`}
function chap(c){
 const n=cnt(c),d=DATA[c];
 $.innerHTML=`<div class="top"><button onclick="home()">←</button><h2>${esc(d.n)}</h2></div>${bar(n)}<span class="mu">${n[2]} gekonnt · ${n[1]} in Übung · ${n[0]} neu</span>
 <div class="row"><button class="p" onclick="run(${c},false)">${n[0]+n[1]?'Üben ('+(n[0]+n[1])+' offen)':'Alles nochmals üben'}</button><button onclick="run(${c},true)">Alle mischen</button></div>
 <div class="card"><b>Übersicht</b><div class="mu">grün = gekonnt · orange = in Übung · grau = neu</div><div class="chips">`+
 d.i.map((x,j)=>{const s=st(c,j);return `<span class="chip s${s}">${s?esc(x[1]):'• • •'}</span>`}).join('')+
 `</div></div><button onclick="if(confirm('Dieses Lernziel zurücksetzen?')){DATA[${c}].i.forEach((_,j)=>delete P[key(${c},j)]);save();chap(${c})}">Lernziel zurücksetzen</button>`;
}
let Q,qi,cc,hint,done,okc;
function run(c,allm){
 cc=c;let ids=DATA[c].i.map((_,j)=>j);if(!allm){const o=ids.filter(j=>st(c,j)<2);if(o.length)ids=o}
 for(let k=ids.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[ids[k],ids[j]]=[ids[j],ids[k]]}
 Q=ids;qi=0;okc=0;card();
}
function card(){
 if(qi>=Q.length){const n=cnt(cc);$.innerHTML=`<div class="big">🎉</div><h2 style="text-align:center">Runde beendet</h2><p style="text-align:center">${okc} von ${Q.length} richtig beim ersten Versuch<br><span class="mu">${n[2]} gekonnt · ${n[1]} in Übung · ${n[0]} neu</span></p><div class="row"><button class="p" onclick="chap(${cc})">Zur Übersicht</button><button onclick="run(${cc},false)">Nochmals</button></div>`;return}
 const x=DATA[cc].i[Q[qi]];hint=0;done=false;
 $.innerHTML=`<div class="top"><button onclick="chap(${cc})">←</button><span class="mu">${DATA[cc].n} · ${qi+1}/${Q.length}</span></div>
 <div class="q">${esc(x[0])}</div><input id="in" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Antwort eingeben">
 <div id="fb"></div><div class="row" id="btns"><button onclick="tip()">Tipp</button><button onclick="skip()">Weiss nicht</button><button class="p" onclick="check()">Prüfen</button></div>`;
 const i=document.getElementById('in');i.focus();i.onkeydown=e=>{if(e.key==='Enter')done?next():check()};
}
function tip(){const x=DATA[cc].i[Q[qi]];hint++;document.getElementById('fb').innerHTML=`<div class="fb">Tipp: <b>${esc(x[1].slice(0,hint))}</b>${'_ '.repeat(Math.max(0,x[1].length-hint))}</div>`}
function mark(ok){const k=key(cc,Q[qi]);if(ok){P[k]=(P[k]||0)+1;if(!hint&&!done.w)okc++}else P[k]=0;save()}
function fin(html,cls){done=true;document.getElementById('fb').innerHTML=`<div class="fb ${cls}">${html}</div>`;document.getElementById('btns').innerHTML=`<button class="p" onclick="next()">Weiter</button>`}
function check(){
 const x=DATA[cc].i[Q[qi]],v=norm(document.getElementById('in').value);if(!v)return;
 const sol=x.slice(1).filter(Boolean),hit=sol.find(s=>s.toLowerCase()===v.toLowerCase());
 if(hit){const ok=hit===v;mark(true);fin(ok?`✔ Richtig!`:`✔ Richtig – achte auf die Schreibweise: <b>${esc(hit)}</b>`,'y')}
 else{mark(false);fin(`✘ Leider falsch.<br>Lösung: <b>${esc(x[1])}</b>${sol.length>1?'<br><span class="mu">auch möglich: '+esc(sol.slice(1).join(', '))+'</span>':''}`,'n')}
}
function skip(){const x=DATA[cc].i[Q[qi]];mark(false);fin(`Lösung: <b>${esc(x[1])}</b>`,'n')}
